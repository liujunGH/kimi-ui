name: release

# In-app updates need two repository secrets before the macOS job can sign the
# update payload (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          contents of ~/.tauri/kimi-ui.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD the key's password ("" if none)
# The matching public key lives in tauri.conf.json → plugins.updater.pubkey.
# Losing the private key means existing installs can no longer verify updates
# and users must reinstall by hand.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the official Kimi Code web bundle
        uses: actions/checkout@v4
        with:
          repository: MoonshotAI/kimi-code
          ref: '@moonshot-ai/kimi-code@0.39.1'
          path: kimi-code
          sparse-checkout: apps/kimi-code/dist-web

      - name: Stage the official web bundle (web-dist/)
        env:
          KIMI_CODE_REPO: ${{ github.workspace }}/kimi-code
        run: bash scripts/build-web.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and package Kimi Code.app
        run: bash packaging/make-app.sh

      - name: Zip the app bundle
        run: cd build && ditto -c -k --sequesterRsrc --keepParent "Kimi Code.app" ../kimi-ui-macos-arm64.zip

      # In-app updater: the plugin downloads a signed .app.tar.gz described by
      # latest.json, so both must be produced here. The tar.gz is written from
      # the same staged bundle the .zip uses, keeping the two in lockstep.
      - name: Build the updater artifact (.app.tar.gz) and sign it
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/make-update-manifest.sh

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "本版本无单独版本说明，详见提交历史。" > notes.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kimi-ui-macos-arm64.zip
            kimi-ui-macos-arm64.app.tar.gz
            latest.json
          body_path: notes.md

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the official Kimi Code web bundle
        uses: actions/checkout@v4
        with:
          repository: MoonshotAI/kimi-code
          ref: '@moonshot-ai/kimi-code@0.39.1'
          path: kimi-code
          sparse-checkout: apps/kimi-code/dist-web

      - name: Stage the official web bundle (web-dist/)
        env:
          KIMI_CODE_REPO: ${{ github.workspace }}/kimi-code
        run: bash scripts/build-web.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo build
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist/KimiUI
          cp target/release/kimi-ui.exe dist/KimiUI/
          cd dist && 7z a ../kimi-ui-windows-x64.zip KimiUI

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "本版本无单独版本说明，详见提交历史。" > notes.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: kimi-ui-windows-x64.zip
          body_path: notes.md
