<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>status</title>
    <style>
      html, body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
        font-size: 12px;
        background: transparent;
        user-select: none;
      }
      :root {
        --bg: rgba(255, 255, 255, 0.96);
        --fg: #24292f;
        --dim: #57606a;
        --border: #d0d7de;
        --accent: #1f6feb;
        --shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: rgba(22, 27, 34, 0.97);
          --fg: #c9d1d9;
          --dim: #8b949e;
          --border: #30363d;
          --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }
      }
      #backdrop {
        position: absolute;
        inset: 0 0 28px 0;
        display: none;
      }
      #backdrop.show { display: block; }
      #bar {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 28px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        box-sizing: border-box;
        background: var(--bg);
        border-top: 1px solid var(--border);
        color: var(--dim);
      }
      #usage { cursor: pointer; padding: 2px 4px; border-radius: 6px; }
      #usage:hover { background: rgba(127, 127, 127, 0.12); }
      #usage b { font-weight: 600; }
      .ok { color: #3fb950; }
      .warn { color: #d29922; }
      .crit { color: #f85149; }
      #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); display: inline-block; }
      #dot.busy { background: #3fb950; }
      #spacer { flex: 1; }
      .btn {
        color: var(--accent);
        cursor: pointer;
        padding: 2px 8px;
        border-radius: 6px;
        font-weight: 600;
      }
      .btn:hover, .btn.active { background: rgba(31, 111, 235, 0.12); }
      .card {
        position: absolute;
        bottom: 36px;
        display: none;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 10px 12px;
        color: var(--fg);
      }
      .card.show { display: block; }
      #usageCard { left: 8px; width: 250px; }
      #updateCard { right: 8px; width: 360px; max-height: 320px; overflow-y: auto; }
      #updateCard h3 { margin: 2px 0 8px; font-size: 13px; }
      #updateCard pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-family: inherit;
        font-size: 12px;
        line-height: 1.6;
        margin: 0;
      }
      #updateCard .go {
        display: inline-block;
        margin-top: 10px;
        color: var(--accent);
        font-weight: 600;
        cursor: pointer;
      }
      #remoteCard { right: 8px; width: 300px; text-align: center; }
      #remoteCard .status { margin-bottom: 4px; }
      #remoteCard img { width: 200px; height: 200px; margin: 4px 0; }
      #remoteCard .url { user-select: text; word-break: break-all; font-size: 11px; padding: 2px 6px; }
      #remoteCard .warn { color: #d29922; margin-top: 6px; font-size: 11px; }
      #remoteCard .actions { margin-top: 8px; }
      #remoteCard .actions span {
        display: inline-block;
        margin: 0 4px;
        padding: 3px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
      }
      #remoteCard .actions span.stop { color: #f85149; border-color: #f85149; }
      .row { display: flex; justify-content: space-between; padding: 2px 0; }
      .row .k { color: var(--dim); }
      .dim { color: var(--dim); }
    </style>
  </head>
  <body>
    <div id="backdrop"></div>
    <div id="usageCard" class="card"></div>
    <div id="updateCard" class="card"></div>
    <div id="remoteCard" class="card"></div>
    <div id="bar">
      <span id="dot"></span>
      <span id="usage">…</span>
      <span id="spacer"></span>
      <span id="plan" class="dim" title="套餐额度（每 10 分钟更新）"></span>
      <span id="updateBadge" class="btn" style="display:none" title="点击打开下载页">⬆ 新版本</span>
      <span id="freezeBtn" class="btn" title="流式输出时是否自动跟随到底部">跟随</span>
      <span id="restartBtn" class="btn" title="用已安装的 CLI 在原端口重启本地 daemon">重启</span>
      <span id="devtoolsBtn" class="btn" title="打开/关闭 Safari Web Inspector（内存/DOM 剖析）">调试</span>
      <span id="rcBtn" class="btn" title="Remote Control：从手机或其他电脑访问本机（官方实验特性）">远程</span>
    </div>
    <script>
      'use strict';
      var mode = 'none';            // 'none' | 'usage' | 'update' | 'remote'
      var lastUsage = null;
      var planUsage = null;
      var planLoadingRounds = 0;

      function invoke(cmd, args) {
        return window.__TAURI_INTERNALS__.invoke(cmd, args || {});
      }
      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }

      // ---- overlay cards ----
      function setMode(next) {
        mode = next;
        invoke('set_overlay', { mode: mode });
        document.getElementById('backdrop').className = mode === 'none' ? '' : 'show';
        document.getElementById('usageCard').className = 'card' + (mode === 'usage' ? ' show' : '');
        document.getElementById('updateCard').className = 'card' + (mode === 'update' ? ' show' : '');
        document.getElementById('remoteCard').className = 'card' + (mode === 'remote' ? ' show' : '');
        document.getElementById('updateBadge').className = 'btn' + (mode === 'update' ? ' active' : '');
        document.getElementById('rcBtn').className = 'btn' + (mode === 'remote' ? ' active' : '');
        if (mode === 'usage') renderUsageCard();
        if (mode === 'update') renderUpdate();
        if (mode === 'remote') { renderRemote(); pollRemote(); }
      }
      document.getElementById('backdrop').onclick = function () { setMode('none'); };
      document.getElementById('usage').onclick = function () {
        setMode(mode === 'usage' ? 'none' : 'usage');
      };

      // ---- scroll freeze toggle ("静止": stop the SPA from auto-pinning
      //      the message list to the bottom while streaming) ----
      var frozen = false;
      document.getElementById('freezeBtn').onclick = function () {
        frozen = !frozen;
        invoke('set_scroll_freeze', { frozen: frozen });
        this.textContent = frozen ? '静止' : '跟随';
        this.className = 'btn' + (frozen ? ' active' : '');
      };

      document.getElementById('devtoolsBtn').onclick = function () {
        invoke('toggle_devtools');
        this.className = this.className === 'btn' ? 'btn active' : 'btn';
      };

      // Restart the LOCAL daemon (same port, freshly launched CLI). Hidden for
      // remote connections, where it would target someone else's machine.
      var restartBtn = document.getElementById('restartBtn');
      function refreshRestartVisibility() {
        invoke('list_connections').then(function (d) {
          var active = d && d.active;
          var conn = ((d && d.connections) || []).filter(function (c) { return c.id === active; })[0];
          restartBtn.style.display = conn && conn.kind === 'remote' ? 'none' : '';
        }).catch(function () {});
      }
      restartBtn.onclick = function () {
        var el = this;
        el.textContent = '重启中…';
        invoke('restart_daemon').then(function () {
          el.textContent = '重启';
          el.className = 'btn';
          window.__kimiConnChanged();
        }).catch(function (e) {
          el.textContent = '重启';
          el.className = 'btn';
          el.title = String(e);
        });
      };
      refreshRestartVisibility();

      // ---- boot: poll the active connection through Rust ----
      // No daemon_info handshake is needed any more: the Rust side owns the
      // daemon details (and the token), so the page just asks for a snapshot.
      function boot() {
        pollUsage();
        setInterval(pollUsage, 12000);
      }
      // Rust calls this when the user switches tabs, so the strip reflects
      // the newly active connection immediately.
      window.__kimiConnChanged = function () {
        lastUsage = null;
        planUsage = null;
        rcStateCache = null;
        rcRenderedSig = null;
        health = 'ok';
        document.getElementById('usage').textContent = '…';
        document.getElementById('plan').textContent = '';
        pollUsage();
        pollPlanUsage();
        refreshRestartVisibility();
      };

      // ---- plan quota (daemon REST /api/v1/oauth/usage; the Rust side
      //      fetches and caches, we format the reset timestamps) ----
      function fmtReset(iso) {
        var ms = Date.parse(iso);
        if (!isFinite(ms)) return '';
        var mins = Math.max(0, Math.round((ms - Date.now()) / 60000));
        var d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
        if (d > 0) return d + '天' + (h ? h + '小时' : '');
        if (h > 0) return h + '小时' + (m ? m + '分' : '');
        return m + '分';
      }
      function pollPlanUsage() {
        invoke('plan_usage').then(function (d) {
          if (d && typeof d.weekly_pct === 'number') {
            planUsage = d;
            planLoadingRounds = 0;
            renderPlan();
            if (mode === 'usage') renderUsageCard();
          } else if (d && d.loading) {
            // Rust is still fetching (daemon just came up) — retry soon
            // instead of waiting out the whole 60s interval.
            if (!planRetryTimer) {
              planRetryTimer = setTimeout(function () {
                planRetryTimer = null;
                pollPlanUsage();
              }, 5000);
            }
          } else {
            // Persistent failure; after a few rounds show a visible
            // degradation instead of nothing.
            if (++planLoadingRounds >= 3 && !planUsage) {
              document.getElementById('plan').textContent = '额度 –';
            }
          }
        }).catch(function () {});
      }
      var planRetryTimer = null;
      function renderPlan() {
        if (!planUsage) return;
        var el = document.getElementById('plan');
        var cls = planUsage.hourly_pct >= 90 ? 'crit' : planUsage.hourly_pct >= 70 ? 'warn' : 'dim';
        el.innerHTML = '5h <b class="' + cls + '" style="font-weight:600">' + planUsage.hourly_pct + '%</b>'
          + ' · 周 ' + planUsage.weekly_pct + '%';
      }
      pollPlanUsage();
      setInterval(pollPlanUsage, 60000);

      // ---- update check (badge -> overlay card with notes + auto-update) ----
      var updateInfo = null;
      var autoTimer = null;
      var autoLine = null;      // status line while downloading/installing
      var autoBtn = null;       // the action button (自动更新/安装并重启/重试)
      function setAutoLine(text) {
        if (autoLine) autoLine.textContent = text || '';
      }
      function stopAutoPoll() {
        if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
      }
      function startAutoPoll() {
        stopAutoPoll();
        autoTimer = setInterval(function () {
          if (mode !== 'update') { stopAutoPoll(); return; }
          invoke('auto_update', { action: 'status' }).then(renderAutoState).catch(function () {});
        }, 1000);
      }
      function renderAutoState(d) {
        if (!d || !autoBtn) return;
        if (d.phase === 'downloading') {
          setAutoLine('下载中 ' + (d.pct || 0) + '%');
          autoBtn.textContent = '下载中 ' + (d.pct || 0) + '%';
          autoBtn.onclick = null;
        } else if (d.phase === 'verifying') {
          setAutoLine('校验中…');
          autoBtn.textContent = '校验中…';
          autoBtn.onclick = null;
        } else if (d.phase === 'ready') {
          setAutoLine(d.message || '已就绪');
          autoBtn.textContent = '安装并重启';
          autoBtn.onclick = function () { invoke('auto_update', { action: 'install' }).catch(function () {}); };
          stopAutoPoll();
        } else if (d.phase === 'error') {
          setAutoLine(d.message || '更新失败');
          autoBtn.textContent = '重试';
          autoBtn.onclick = function () {
            invoke('auto_update', { action: 'start' }).catch(function () {});
            startAutoPoll();
          };
          stopAutoPoll();
        }
      }
      function renderUpdate() {
        var d = updateInfo;
        if (!d) return;
        var card = document.getElementById('updateCard');
        card.innerHTML = '';
        var h = document.createElement('h3');
        h.textContent = '新版本 v' + d.latest;
        card.appendChild(h);
        var pre = document.createElement('pre');
        pre.textContent = d.notes && d.notes.trim() ? d.notes : '（该版本未提供版本说明）';
        card.appendChild(pre);
        autoLine = document.createElement('div');
        autoLine.className = 'dim';
        autoLine.style.marginTop = '8px';
        card.appendChild(autoLine);
        if (d.can_auto_update) {
          autoBtn = document.createElement('span');
          autoBtn.className = 'go';
          autoBtn.textContent = '自动更新';
          autoBtn.onclick = function () {
            invoke('auto_update', { action: 'start' }).catch(function () {});
            startAutoPoll();
          };
          card.appendChild(autoBtn);
        }
        var go = document.createElement('span');
        go.className = 'go';
        go.style.marginLeft = '16px';
        go.textContent = '前往下载 →';
        go.onclick = function () { invoke('open_url', { url: d.url }); };
        card.appendChild(go);
        // If a pipeline is already mid-flight, resume its display.
        invoke('auto_update', { action: 'status' }).then(function (s) {
          if (s && s.phase && s.phase !== 'idle') { startAutoPoll(); renderAutoState(s); }
        }).catch(function () {});
      }
      function pollUpdate() {
        invoke('update_info').then(function (d) {
          if (d === null) {
            // The release check hasn't answered yet — retry soon instead of
            // waiting out the whole 30-minute interval.
            if (updateCheckTries++ < 30) setTimeout(pollUpdate, 5000);
            return;
          }
          var el = document.getElementById('updateBadge');
          if (d && d.has_update) {
            updateInfo = d;
            el.style.display = '';
            el.textContent = '⬆ ' + d.latest;
            el.title = '查看更新内容';
            el.onclick = function () { setMode(mode === 'update' ? 'none' : 'update'); };
          }
        }).catch(function () {});
      }
      var updateCheckTries = 0;
      pollUpdate();
      setInterval(pollUpdate, 30 * 60 * 1000);

      // ---- usage polling + structural health check ----
      // Three states: ok / down (daemon unreachable, transient) / broken
      // (daemon alive but REST shape drifted → shell needs an update).
      // Data comes from Rust (`daemon_snapshot`) rather than a webview fetch:
      // this page's origin is tauri://localhost, so a cross-origin request to
      // a remote daemon would be rejected by its origin check.
      var health = 'ok';
      function setHealth(next) {
        if (health === next) return;
        health = next;
        renderBar();
      }
      function pollUsage() {
        invoke('daemon_snapshot').then(function (d) {
          if (!d || d.state === 'down') { setHealth('down'); return; }
          if (d.state === 'broken') { setHealth('broken'); return; }
          setHealth('ok');
          // A daemon with no sessions yet still means "connected"; show that
          // rather than leaving the strip stuck on the loading dots.
          if (!d.session) {
            lastUsage = null;
            document.getElementById('usage').textContent = '暂无会话';
            document.getElementById('dot').className = '';
            return;
          }
          lastUsage = { session: d.session, status: d.status || {} };
          renderBar();
          if (mode === 'usage') renderUsageCard();
        }).catch(function () { setHealth('down'); });
      }
      function renderBar() {
        var usageEl = document.getElementById('usage');
        if (health === 'down') { usageEl.innerHTML = '<span class="dim">daemon 未连接</span>'; return; }
        if (health === 'broken') { usageEl.innerHTML = '<span class="crit">接口结构变化，壳需要更新</span>'; return; }
        if (!lastUsage) return;
        var st = lastUsage.status;
        var pct = Math.round((st.context_usage || 0) * 100);
        var cls = pct >= 90 ? 'crit' : pct >= 70 ? 'warn' : 'ok';
        var model = st.model ? String(st.model).split('/').pop() : '';
        usageEl.innerHTML =
          '上下文 <b class="' + cls + '">' + pct + '%</b>' + (model ? ' · ' + esc(model) : '');
        document.getElementById('dot').className = st.busy ? 'busy' : '';
        document.getElementById('dot').title = st.busy ? '运行中' : '空闲';
      }
      function renderUsageCard() {
        if (!lastUsage) return;
        var st = lastUsage.status, s = lastUsage.session;
        var rows = [
          ['会话', String(s.title || '').slice(0, 24)],
          ['模型', st.model || '-'],
          ['思考', st.thinking_level || '-'],
          ['权限', st.permission || '-'],
          ['上下文', (st.context_tokens || 0) + ' / ' + (st.max_context_tokens || 0)],
          ['状态', st.busy ? '运行中' : '空闲']
        ];
        document.getElementById('usageCard').innerHTML = rows.map(function (r) {
          return '<div class="row"><span class="k">' + esc(r[0]) + '</span><span>' + esc(String(r[1])) + '</span></div>';
        }).join('');
      }

      // ---- Remote Control card (official experimental `kimi rc` wrapper) ----
      var rcTimer = null;
      var rcStateCache = null;
      var rcRenderedSig = null;
      document.getElementById('rcBtn').onclick = function () {
        if (mode === 'remote') { setMode('none'); return; }
        setMode('remote');
        invoke('remote_control', { action: 'start' }).catch(function () {});
      };
      function renderRemote() {
        var card = document.getElementById('remoteCard');
        var d = rcStateCache;
        // Re-render only on state changes: the 1.5s poll otherwise rebuilds
        // the card (and the AX tree) constantly.
        var sig = d ? [d.running, d.starting, d.url, d.error].join('|') : 'null';
        if (sig === rcRenderedSig) return;
        rcRenderedSig = sig;
        if (!d) {
          card.innerHTML = '<div class="dim">获取状态…</div>';
          return;
        }
        if (d.running && d.url) {
          card.innerHTML =
            '<div class="status ok">● 远程访问已就绪</div>'
            + '<img alt="二维码" src="data:image/png;base64,' + String(d.qr_base64 || '') + '">'
            + '<div class="url">' + esc(d.url) + '</div>'
            + '<div class="actions"><span id="rcCopy">复制链接</span><span class="stop" id="rcStop">停止</span></div>'
            + '<div class="warn">⚠ 此链接可控制本机，请勿分享</div>';
          document.getElementById('rcCopy').onclick = function () {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(d.url).catch(function () {});
            }
          };
          document.getElementById('rcStop').onclick = function () {
            invoke('remote_control', { action: 'stop' }).then(function () { pollRemoteSoon(); }).catch(function () {});
          };
        } else if (d.starting) {
          card.innerHTML = '<div class="dim">正在启动 Remote Control…（首次约需数秒）</div>';
        } else if (d.error) {
          card.innerHTML =
            '<div class="status crit">● 启动失败</div>'
            + '<div class="url">' + esc(d.error) + '</div>'
            + '<div class="actions"><span id="rcRetry">重试</span></div>';
          document.getElementById('rcRetry').onclick = function () {
            invoke('remote_control', { action: 'start' }).then(function () { pollRemoteSoon(); }).catch(function () {});
          };
        } else {
          card.innerHTML = '<div class="dim">Remote Control 未运行</div>'
            + '<div class="actions"><span id="rcRetry">启动</span></div>';
          document.getElementById('rcRetry').onclick = function () {
            invoke('remote_control', { action: 'start' }).then(function () { pollRemoteSoon(); }).catch(function () {});
          };
        }
      }
      function pollRemote() {
        if (rcTimer) { clearInterval(rcTimer); rcTimer = null; }
        var tick = function () {
          if (mode !== 'remote') { if (rcTimer) { clearInterval(rcTimer); rcTimer = null; } return; }
          invoke('remote_control', { action: 'status' }).then(function (d) {
            rcStateCache = d;
            renderRemote();
          }).catch(function () {});
        };
        tick();
        rcTimer = setInterval(tick, 1500);
      }
      function pollRemoteSoon() {
        setTimeout(function () { if (mode === 'remote') pollRemote(); }, 400);
      }

      boot();
    </script>
  </body>
</html>
